name: Admin Panel checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: admin-panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check admin-panel.js
      - run: npm test
